# ==============================================================================
# Google ADK & agents-cli Integration Manifest
# Project: olympus-product-specialist
# Platform DNA: Production-Only Product Specialist Agent Hierarchy
# ==============================================================================

schema_version: "1.0"

metadata:
  name: "olympus-product-specialist"
  display_name: "Olympus Product Specialist Production Fleet"
  version: "1.0.0"
  description: "Production-ready AI Specialist for Olympus/Evident Microscopy Systems with in-app local worker engines ($0 Cost)"
  author: "Olympus Product Specialist Team"
  license: "Proprietary"

runtime:
  framework: "google-adk"
  python_version: ">=3.14"
  agent_directory: "src/olympus_specialist"
  entrypoint:
    module: "olympus_specialist.adk_app"
    factory: "create_adk_app"
    app_accessor: "get_adk_app"
    cli_command: "olympus-specialist"

agent_hierarchy:
  root_agent:
    id: "root_specialist"
    name: "Olympus Master Specialist Orchestrator"
    role: "Production Root Specialist Agent & Hardware Compatibility Manager"
    default_model: "gemini-2.5-flash"
    temperature: 0.1
    sop_reference: "src/olympus_specialist/sops/specialist_sop.yaml"
    prompt_template: "src/olympus_specialist/prompts/system_prompt.yaml"

  subagents:
    # --------------------------------------------------------------------------
    # PRODUCTION IN-APP WORKER SUBAGENTS ($0.00 Cost, Shipped Inside Repo)
    # --------------------------------------------------------------------------
    - id: "local_optics_worker"
      name: "Optical Compatibility Rules Worker"
      role: "Executes stand, observation mode, and objective optical compatibility checks ($0 Cost)"
      model: "local-python-rules"
      temperature: 0.0
      cost_category: "free_local"

    - id: "local_catalog_worker"
      name: "SQLite Catalog & Vector Inspector Worker"
      role: "Performs instant local catalog lookups and spec verification ($0 Cost)"
      model: "local-sqlite-vector"
      temperature: 0.0
      cost_category: "free_local"

    - id: "local_formatter_worker"
      name: "Bilingual Formatter & Spec Document Sync Worker"
      role: "Processes text formatting and bilingual document synthesis ($0 Cost)"
      model: "local-text-processor"
      temperature: 0.0
      cost_category: "free_local"

telemetry:
  enabled: true
  tracker_module: "olympus_specialist.telemetry.hierarchical_tracker"
  tracker_class: "HierarchicalTokenTracker"
  tracked_metrics:
    - "prompts"
    - "response_metadata"
    - "tool_calls"
    - "token_spend"
    - "agent_hierarchy_rollup"
    - "overload_error_counters"
  export_format: "json"
  log_directory: "logs/"

guardrails:
  daily_budget_usd: 5.00
  circuit_breaker_module: "olympus_specialist.guardrails.cost_gate"
  circuit_breaker_function: "check_budget_limit"
  idle_shutdown_seconds: 300
  overload_backoff_seconds: 300

evals:
  dataset_path: "evals/datasets/golden_scenarios.json"
  grader_module: "evals.graders.local_judge"
  command: "agents-cli eval --manifest agents-cli-manifest.yaml"
