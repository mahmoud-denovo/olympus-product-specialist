[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olympus-product-specialist"
version = "0.1.0"
description = "AI-First Web Platform & Technical Specialist for Olympus/Evident Microscopy Systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "google-genai>=0.1.0",
    "httpx>=0.27.0",
    "httpx2>=0.1.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "pytest>=8.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/olympus_specialist"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
python_files = ["test_*.py"]
